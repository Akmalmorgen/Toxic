services:
  - type: web
    name: toxicuz-bot
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /
    envVars:
      # ===== ОБЯЗАТЕЛЬНЫЕ =====
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false

      # ===== РЕКОМЕНДУЕМЫЕ =====
      - key: DATABASE_URL
        sync: false

      # ===== ОПЦИОНАЛЬНЫЕ =====
      - key: ADMIN_ACCESS_KEY
        sync: false

      # ===== СЛУЖЕБНЫЕ =====
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: PYTHONUNBUFFERED
        value: "1"
